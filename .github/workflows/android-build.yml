name: Build IPTVHeroProTV v6/7 APK

on:
  push:
    branches: [ "main", "master", "v7", "v6-7", "v6_7" ]
  pull_request:
    branches: [ "main", "master", "v7", "v6-7", "v6_7" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle CLI & Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7.2'

      - name: Ensure gradlew and wrapper jar exist
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.7.2 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Assemble Debug APK
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVHeroProTV-v6-7-debug
          path: app/build/outputs/apk/debug/*.apk
